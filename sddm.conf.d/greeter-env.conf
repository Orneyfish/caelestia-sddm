[General]
# Passed directly into the sddm-greeter-qt6 process. This is NOT the same as
# setting Environment= in a systemd sddm.service.d/ override — sddm-helper
# spawns the greeter inside a fresh PAM session for the sddm user, which does
# not inherit the parent systemd unit's environment. GreeterEnvironment is
# SDDM's own supported mechanism for exactly this, and is the only one that
# actually reaches the greeter.
#
# Required for MColours.qml (reads matugen's colors.json) and the system-info
# widgets (reads /proc, /sys) — without it, every local file:// XMLHttpRequest
# in the theme silently fails, colours.ready never becomes true, and the
# entire surface card stays invisible. All you'd see is the blurred wallpaper.
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1
