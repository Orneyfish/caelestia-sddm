[General]
# Path to the wallpaper. If it's in the assets folder, use "assets/background.jpg"
background=assets/background.jpg

# Colors
accentColor=#A9C78F
autoColor=true
use24HourClock=false
backgroundColor=#1A1C18
textColor=#E3E3DC

# Font family. Override with any installed system font.
fontFamily=

# Google Calendar "secret address in iCal format" (Calendar Settings > your
# calendar > Integrate calendar). Leave blank to show just the month grid
# with no upcoming-events list.
calendarIcalUrl=

# Google News RSS feed URL. Leave blank for general Top Stories in your
# locale. To follow specific topics, use a search feed, e.g.:
# https://news.google.com/rss/search?q=Technology+OR+Sports&hl=en-US&gl=US&ceid=US:en
newsFeedUrl=
